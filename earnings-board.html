<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E14;
    --bg-elev: #12161F;
    --bg-elev-2: #171C27;
    --text: #E8E6E1;
    --text-dim: #7C8494;
    --text-dimmer: #4B5262;
    --amber: #E3B341;
    --teal: #4FD1C5;
    --red: #E5626A;
    --line: #232838;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100%;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0;
  }
  h1 span { color: var(--amber); }
  .subtitle {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 28px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .add-row input {
    flex: 1;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.05em;
    padding: 12px 14px;
    border-radius: 4px;
    text-transform: uppercase;
    outline: none;
  }
  .add-row input:focus { border-color: var(--teal); }
  .add-row input::placeholder { color: var(--text-dimmer); text-transform: none; }
  button {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    border: none;
    border-radius: 4px;
    padding: 12px 16px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.85; }
  button:active { opacity: 0.65; }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-add { background: var(--teal); color: #06201D; }
  .btn-refresh {
    background: var(--bg-elev-2);
    color: var(--text);
    border: 1px solid var(--line);
    width: 100%;
    margin-top: 18px;
    padding: 13px;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    color: var(--text-dimmer);
    font-size: 11px;
    letter-spacing: 0.06em;
    margin-top: 10px;
    text-transform: uppercase;
  }
  .board {
    margin-top: 26px;
    border-top: 1px solid var(--line);
  }
  .row {
    display: grid;
    grid-template-columns: 90px 1fr auto 50px 20px;
    align-items: center;
    gap: 14px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
    animation: rise 0.35s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ticker {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.03em;
  }
  .name {
    color: var(--text-dim);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .date {
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
  }
  .date.unknown { color: var(--text-dimmer); font-style: italic; }
  .days {
    font-size: 12px;
    font-weight: 600;
    text-align: right;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .days.soon { color: var(--red); }
  .days.near { color: var(--amber); }
  .days.far { color: var(--teal); }
  .remove {
    background: none;
    border: none;
    color: var(--text-dimmer);
    font-size: 16px;
    cursor: pointer;
    padding: 0 0 0 8px;
    line-height: 1;
  }
  .remove:hover { color: var(--red); }
  .empty {
    color: var(--text-dimmer);
    font-size: 13px;
    padding: 40px 4px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .error {
    color: var(--red);
    font-size: 12px;
    margin-top: 10px;
  }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--text-dimmer);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EARNINGS<span>_</span>BOARD</h1>
  </header>
  <p class="subtitle">Next scheduled earnings date, by ticker</p>

  <div class="add-row">
    <input id="symbolInput" type="text" placeholder="Add symbol (e.g. AAPL)" maxlength="10">
    <button class="btn-add" id="addBtn">Add</button>
  </div>

  <div id="board" class="board"></div>

  <button class="btn-refresh" id="refreshBtn">Refresh earnings dates</button>
  <div class="meta-row">
    <span id="lastUpdated">Never updated</span>
    <span id="count">0 symbols</span>
  </div>
  <div id="errorMsg" class="error"></div>
</div>

<script>
const STATE_KEY = 'board-state';
let watchlist = [];
let earningsData = {}; // { SYMBOL: { date: 'YYYY-MM-DD'|null, name: string|null } }
let lastUpdated = null;

const boardEl = document.getElementById('board');
const inputEl = document.getElementById('symbolInput');
const addBtn = document.getElementById('addBtn');
const refreshBtn = document.getElementById('refreshBtn');
const lastUpdatedEl = document.getElementById('lastUpdated');
const countEl = document.getElementById('count');
const errorEl = document.getElementById('errorMsg');

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function formatDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function render() {
  countEl.textContent = watchlist.length + (watchlist.length === 1 ? ' symbol' : ' symbols');
  lastUpdatedEl.textContent = lastUpdated ? 'Updated ' + new Date(lastUpdated).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Never updated';

  if (watchlist.length === 0) {
    boardEl.innerHTML = '<div class="empty">No symbols yet. Add a ticker above to start tracking its next earnings date.</div>';
    return;
  }

  const sorted = [...watchlist].sort((a, b) => {
    const da = daysUntil(earningsData[a]?.date);
    const db = daysUntil(earningsData[b]?.date);
    if (da === null && db === null) return a.localeCompare(b);
    if (da === null) return 1;
    if (db === null) return -1;
    return da - db;
  });

  boardEl.innerHTML = sorted.map(sym => {
    const info = earningsData[sym] || {};
    const d = daysUntil(info.date);
    let daysLabel = '—';
    let daysClass = '';
    if (d !== null) {
      if (d < 0) { daysLabel = 'PASSED'; daysClass = 'far'; }
      else if (d === 0) { daysLabel = 'TODAY'; daysClass = 'soon'; }
      else if (d <= 7) { daysLabel = d + 'D'; daysClass = 'soon'; }
      else if (d <= 21) { daysLabel = d + 'D'; daysClass = 'near'; }
      else { daysLabel = d + 'D'; daysClass = 'far'; }
    }
    const dateLabel = info.date ? formatDate(info.date) : (info.checked ? 'Unknown' : 'Not checked yet');
    const dateClass = info.date ? '' : 'unknown';
    return `
      <div class="row">
        <div class="ticker">${sym}</div>
        <div class="name">${info.name || ''}</div>
        <div class="date ${dateClass}">${dateLabel}</div>
        <div class="days ${daysClass}">${daysLabel}</div>
        <button class="remove remove-btn" data-symbol="${sym}" title="Remove ${sym}">×</button>
      </div>`;
  }).join('');
}

async function loadStorage() {
  try {
    const state = await window.storage.get(STATE_KEY, false);
    if (state) {
      const parsed = JSON.parse(state.value);
      watchlist = parsed.watchlist || [];
      earningsData = parsed.data || {};
      lastUpdated = parsed.updatedAt || null;
    }
  } catch (e) {
    console.error('load failed', e);
  }
  render();
}

async function saveState() {
  const payload = JSON.stringify({ watchlist, data: earningsData, updatedAt: lastUpdated });
  const delays = [300, 1000, 2500]; // retry with backoff on transient failures
  for (let attempt = 0; attempt <= delays.length; attempt++) {
    try {
      const result = await window.storage.set(STATE_KEY, payload, false);
      if (result) {
        errorEl.textContent = '';
        return true;
      }
      throw new Error('Storage set returned null');
    } catch (e) {
      console.error('save attempt ' + (attempt + 1) + ' failed', e);
      if (attempt < delays.length) {
        await new Promise(r => setTimeout(r, delays[attempt]));
      } else {
        errorEl.textContent = 'Could not save your changes to storage — they may not persist if you close this tab. Will keep retrying on your next action.';
      }
    }
  }
  return false;
}

function addSymbol() {
  const raw = inputEl.value.trim().toUpperCase();
  if (!raw) return;
  const symbols = raw.split(/[\s,]+/).filter(Boolean);
  let added = false;
  symbols.forEach(sym => {
    if (!watchlist.includes(sym)) {
      watchlist.push(sym);
      earningsData[sym] = earningsData[sym] || { date: null, name: null, checked: false };
      added = true;
    }
  });
  inputEl.value = '';
  if (added) {
    saveState();
    render();
  }
}

function removeSymbol(sym) {
  watchlist = watchlist.filter(s => s !== sym);
  delete earningsData[sym];
  saveState();
  render();
}

async function fetchEarningsDates() {
  if (watchlist.length === 0) return;
  errorEl.textContent = '';
  refreshBtn.disabled = true;
  refreshBtn.innerHTML = '<span class="spinner"></span>Fetching…';

  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);
  const farOut = new Date(today);
  farOut.setDate(farOut.getDate() + 200);
  const farOutStr = farOut.toISOString().slice(0, 10);

  const prompt = `I need the next scheduled earnings announcement date for each of these stock ticker symbols: ${watchlist.join(', ')}.

IMPORTANT: The "earnings-company" (per-symbol) endpoint on the FMP calendar tool is NOT available on this account's plan and will return an access-denied error — do not use it, and do not retry it if it errors.

Instead, use the FMP:calendar tool with endpoint="earnings-calendar" (the bulk calendar, which IS available), with from_date="${todayStr}" and to_date="${farOutStr}", and a high limit (e.g. limit=1000). Page through results (page=0,1,2,...) if needed until you've either found every symbol or covered the full date range. From the returned list, pick out the rows whose "symbol" field matches (case-insensitive) each of the ticker symbols above, and take the earliest future date for each.

Respond with ONLY a raw JSON object, no markdown code fences, no commentary, in exactly this shape:
{"SYMBOL": {"date": "YYYY-MM-DD" or null, "name": null}, ...}
Include an entry for every symbol listed, even if it wasn't found in the calendar (use null for date in that case). Leave "name" as null — do not look up company names.`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4096,
        messages: [{ role: "user", content: prompt }],
        mcp_servers: [
          { type: "url", url: "https://financialmodelingprep.com/mcp", name: "fmp-mcp" }
        ]
      })
    });

    if (!response.ok) throw new Error('API request failed: ' + response.status);
    const data = await response.json();

    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    const combined = textBlocks.join('\n').trim();
    const jsonMatch = combined.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('No JSON found in response');
    const parsed = JSON.parse(jsonMatch[0]);

    watchlist.forEach(sym => {
      const entry = parsed[sym];
      earningsData[sym] = {
        date: entry?.date || null,
        name: entry?.name || earningsData[sym]?.name || null,
        checked: true
      };
    });

    lastUpdated = new Date().toISOString();
    await saveState();
    render();
  } catch (e) {
    console.error(e);
    errorEl.textContent = 'Could not fetch earnings dates. Try refreshing again.';
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.textContent = 'Refresh earnings dates';
  }
}

addBtn.addEventListener('click', addSymbol);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addSymbol(); });
refreshBtn.addEventListener('click', fetchEarningsDates);

boardEl.addEventListener('click', e => {});

// Use event delegation for remove buttons added dynamically
document.addEventListener('click', e => {
  if (e.target.classList.contains('remove-btn')) {
    removeSymbol(e.target.dataset.symbol);
  }
});

loadStorage();
</script>
</body>
</html>
