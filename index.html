<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnings Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0E14;
    --bg-elev: #12161F;
    --bg-elev-2: #171C27;
    --text: #E8E6E1;
    --text-dim: #7C8494;
    --text-dimmer: #4B5262;
    --amber: #E3B341;
    --teal: #4FD1C5;
    --red: #E5626A;
    --line: #232838;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100%;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0;
  }
  h1 span { color: var(--amber); }
  .subtitle {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 28px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .add-row input {
    flex: 1;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.05em;
    padding: 12px 14px;
    border-radius: 4px;
    text-transform: uppercase;
    outline: none;
  }
  .add-row input:focus { border-color: var(--teal); }
  .add-row input::placeholder { color: var(--text-dimmer); text-transform: none; }
  button {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.04em;
    border: none;
    border-radius: 4px;
    padding: 12px 16px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.85; }
  button:active { opacity: 0.65; }
  button:disabled { opacity: 0.4; cursor: default; }
  .btn-add { background: var(--teal); color: #06201D; }
  .btn-refresh {
    background: var(--bg-elev-2);
    color: var(--text);
    border: 1px solid var(--line);
    width: 100%;
    margin-top: 18px;
    padding: 13px;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    color: var(--text-dimmer);
    font-size: 11px;
    letter-spacing: 0.06em;
    margin-top: 10px;
    text-transform: uppercase;
  }
  .board {
    margin-top: 26px;
    border-top: 1px solid var(--line);
  }
  .sort-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
  }
  .sort-label {
    color: var(--text-dimmer);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .sort-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .sort-btn {
    background: var(--bg-elev);
    color: var(--text-dim);
    border: none;
    border-radius: 0;
    padding: 8px 14px;
    font-size: 12px;
  }
  .sort-btn.active {
    background: var(--teal);
    color: #06201D;
  }
  .row {
    display: grid;
    grid-template-columns: 90px 1fr auto 50px 20px;
    align-items: center;
    gap: 14px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
    animation: rise 0.35s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ticker {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.03em;
  }
  .name {
    color: var(--text-dim);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .date {
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
  }
  .date.unknown { color: var(--text-dimmer); font-style: italic; }
  .days {
    font-size: 12px;
    font-weight: 600;
    text-align: right;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .days.soon { color: var(--red); }
  .days.near { color: var(--amber); }
  .days.far { color: var(--teal); }
  .remove {
    background: none;
    border: none;
    color: var(--text-dimmer);
    font-size: 16px;
    cursor: pointer;
    padding: 0 0 0 8px;
    line-height: 1;
  }
  .remove:hover { color: var(--red); }
  .empty {
    color: var(--text-dimmer);
    font-size: 13px;
    padding: 40px 4px;
    text-align: center;
    border-bottom: 1px solid var(--line);
  }
  .error {
    color: var(--red);
    font-size: 12px;
    margin-top: 10px;
  }
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--text-dimmer);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EARNINGS<span>_</span>BOARD</h1>
  </header>
  <p class="subtitle">Next scheduled earnings date, by ticker</p>

  <div class="add-row">
    <input id="symbolInput" type="text" placeholder="Add symbols, e.g. AAPL MSFT NVDA" maxlength="120">
    <button class="btn-add" id="addBtn">Add</button>
  </div>

  <div class="add-row" id="apiKeyRow">
    <input id="apiKeyInput" type="password" placeholder="Your FMP API key (saved in this browser only)">
    <button class="btn-add" id="saveKeyBtn">Save key</button>
  </div>

  <div class="sort-row">
    <span class="sort-label">Sort by</span>
    <div class="sort-toggle">
      <button class="sort-btn" id="sortSoonestBtn">Soonest date</button>
      <button class="sort-btn" id="sortAlphaBtn">Alphabetical</button>
    </div>
  </div>

  <div id="board" class="board"></div>

  <button class="btn-refresh" id="refreshBtn">Refresh earnings dates</button>
  <div class="meta-row">
    <span id="lastUpdated">Never updated</span>
    <span id="count">0 symbols</span>
  </div>
  <div id="errorMsg" class="error"></div>
</div>

<script>
const STATE_KEY = 'earnings-board-state';
const API_KEY_STORAGE = 'earnings-board-fmp-key';
let watchlist = [];
let earningsData = {}; // { SYMBOL: { date: 'YYYY-MM-DD'|null, name: string|null } }
let lastUpdated = null;
let fmpApiKey = '';
let sortMode = 'soonest'; // 'soonest' | 'alpha'

const boardEl = document.getElementById('board');
const inputEl = document.getElementById('symbolInput');
const addBtn = document.getElementById('addBtn');
const apiKeyInput = document.getElementById('apiKeyInput');
const saveKeyBtn = document.getElementById('saveKeyBtn');
const refreshBtn = document.getElementById('refreshBtn');
const lastUpdatedEl = document.getElementById('lastUpdated');
const countEl = document.getElementById('count');
const errorEl = document.getElementById('errorMsg');
const sortSoonestBtn = document.getElementById('sortSoonestBtn');
const sortAlphaBtn = document.getElementById('sortAlphaBtn');

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const target = new Date(dateStr + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function formatDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function render() {
  countEl.textContent = watchlist.length + (watchlist.length === 1 ? ' symbol' : ' symbols');
  lastUpdatedEl.textContent = lastUpdated ? 'Updated ' + new Date(lastUpdated).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : 'Never updated';

  if (watchlist.length === 0) {
    boardEl.innerHTML = '<div class="empty">No symbols yet. Add a ticker above to start tracking its next earnings date.</div>';
    return;
  }

  sortSoonestBtn.classList.toggle('active', sortMode === 'soonest');
  sortAlphaBtn.classList.toggle('active', sortMode === 'alpha');

  const sorted = [...watchlist].sort((a, b) => {
    if (sortMode === 'alpha') return a.localeCompare(b);
    const da = daysUntil(earningsData[a]?.date);
    const db = daysUntil(earningsData[b]?.date);
    if (da === null && db === null) return a.localeCompare(b);
    if (da === null) return 1;
    if (db === null) return -1;
    return da - db;
  });

  boardEl.innerHTML = sorted.map(sym => {
    const info = earningsData[sym] || {};
    const d = daysUntil(info.date);
    let daysLabel = '—';
    let daysClass = '';
    if (d !== null) {
      if (d < 0) { daysLabel = 'PASSED'; daysClass = 'far'; }
      else if (d === 0) { daysLabel = 'TODAY'; daysClass = 'soon'; }
      else if (d <= 7) { daysLabel = d + 'D'; daysClass = 'soon'; }
      else if (d <= 21) { daysLabel = d + 'D'; daysClass = 'near'; }
      else { daysLabel = d + 'D'; daysClass = 'far'; }
    }
    const dateLabel = info.date ? formatDate(info.date) : (info.checked ? 'Unknown' : 'Not checked yet');
    const dateClass = info.date ? '' : 'unknown';
    return `
      <div class="row">
        <div class="ticker">${sym}</div>
        <div class="name">${info.name || ''}</div>
        <div class="date ${dateClass}">${dateLabel}</div>
        <div class="days ${daysClass}">${daysLabel}</div>
        <button class="remove remove-btn" data-symbol="${sym}" title="Remove ${sym}">×</button>
      </div>`;
  }).join('');
}

function loadStorage() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      watchlist = parsed.watchlist || [];
      earningsData = parsed.data || {};
      lastUpdated = parsed.updatedAt || null;
      sortMode = parsed.sortMode === 'alpha' ? 'alpha' : 'soonest';
    }
  } catch (e) {
    console.error('load failed', e);
  }
  try {
    fmpApiKey = localStorage.getItem(API_KEY_STORAGE) || '';
    if (fmpApiKey) apiKeyInput.placeholder = 'API key saved (hidden)';
  } catch (e) {
    console.error('load api key failed', e);
  }
  render();
}

function saveState() {
  try {
    const payload = JSON.stringify({ watchlist, data: earningsData, updatedAt: lastUpdated, sortMode });
    localStorage.setItem(STATE_KEY, payload);
    errorEl.textContent = '';
    return true;
  } catch (e) {
    console.error('save failed', e);
    errorEl.textContent = 'Could not save to this browser\'s storage. Your changes may not persist after you close the tab.';
    return false;
  }
}

function saveApiKey() {
  const key = apiKeyInput.value.trim();
  if (!key) return;
  fmpApiKey = key;
  try {
    localStorage.setItem(API_KEY_STORAGE, key);
    apiKeyInput.value = '';
    apiKeyInput.placeholder = 'API key saved (hidden)';
    errorEl.textContent = '';
  } catch (e) {
    errorEl.textContent = 'Could not save API key to this browser.';
  }
}

function addSymbol() {
  const raw = inputEl.value.trim().toUpperCase();
  if (!raw) return;
  const symbols = raw.split(/[\s,]+/).filter(Boolean);
  let added = false;
  symbols.forEach(sym => {
    if (!watchlist.includes(sym)) {
      watchlist.push(sym);
      earningsData[sym] = earningsData[sym] || { date: null, name: null, checked: false };
      added = true;
    }
  });
  inputEl.value = '';
  if (added) {
    saveState();
    render();
  }
}

function removeSymbol(sym) {
  watchlist = watchlist.filter(s => s !== sym);
  delete earningsData[sym];
  saveState();
  render();
}

async function fetchEarningsDates() {
  if (watchlist.length === 0) return;
  if (!fmpApiKey) {
    errorEl.textContent = 'Add your FMP API key above first (free at financialmodelingprep.com), then refresh.';
    return;
  }
  errorEl.textContent = '';
  refreshBtn.disabled = true;
  refreshBtn.innerHTML = '<span class="spinner"></span>Fetching…';

  const today = new Date();
  const todayStr = today.toISOString().slice(0, 10);

  try {
    // FMP's earnings calendar only allows ~3 months per request on most plans,
    // so page forward in 90-day windows until every symbol is found or we've
    // looked out far enough.
    const found = {};
    let windowStart = new Date(today);
    for (let i = 0; i < 4 && Object.keys(found).length < watchlist.length; i++) {
      const from = windowStart.toISOString().slice(0, 10);
      const windowEnd = new Date(windowStart);
      windowEnd.setDate(windowEnd.getDate() + 90);
      const to = windowEnd.toISOString().slice(0, 10);

      const url = `https://financialmodelingprep.com/stable/earnings-calendar?from=${from}&to=${to}&apikey=${encodeURIComponent(fmpApiKey)}`;
      const response = await fetch(url);
      if (!response.ok) {
        if (response.status === 401 || response.status === 403) {
          throw new Error('FMP rejected the API key (unauthorized). Double-check the key you saved.');
        }
        throw new Error('FMP request failed: ' + response.status);
      }
      const rows = await response.json();
      if (!Array.isArray(rows)) throw new Error('Unexpected response from FMP');

      rows.forEach(row => {
        const sym = (row.symbol || '').toUpperCase();
        if (watchlist.includes(sym) && row.date) {
          if (!found[sym] || row.date < found[sym]) found[sym] = row.date;
        }
      });

      windowStart = windowEnd;
    }

    watchlist.forEach(sym => {
      earningsData[sym] = {
        date: found[sym] || null,
        name: earningsData[sym]?.name || null,
        checked: true
      };
    });

    lastUpdated = new Date().toISOString();
    saveState();
    render();
  } catch (e) {
    console.error(e);
    errorEl.textContent = e.message || 'Could not fetch earnings dates. Try refreshing again.';
  } finally {
    refreshBtn.disabled = false;
    refreshBtn.textContent = 'Refresh earnings dates';
  }
}

addBtn.addEventListener('click', addSymbol);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addSymbol(); });
saveKeyBtn.addEventListener('click', saveApiKey);
apiKeyInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveApiKey(); });
refreshBtn.addEventListener('click', fetchEarningsDates);
sortSoonestBtn.addEventListener('click', () => { sortMode = 'soonest'; saveState(); render(); });
sortAlphaBtn.addEventListener('click', () => { sortMode = 'alpha'; saveState(); render(); });

boardEl.addEventListener('click', e => {});

// Use event delegation for remove buttons added dynamically
document.addEventListener('click', e => {
  if (e.target.classList.contains('remove-btn')) {
    removeSymbol(e.target.dataset.symbol);
  }
});

loadStorage();
</script>
</body>
</html>
